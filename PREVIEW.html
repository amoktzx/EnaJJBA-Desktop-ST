<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Предпросмотр · Ena Desktop 2001</title><style>body{margin:0}/* Ena Desktop 2001 — scoped, Windows 2000-inspired shell. */
#ena-desktop-root, #ena-desktop-fab {font-family:Tahoma,Verdana,Arial,sans-serif!important;font-weight:400;font-size:13px;color:#171717;}
#ena-desktop-root *,#ena-desktop-root *::before,#ena-desktop-root *::after,#ena-desktop-fab *{box-sizing:border-box;}
#ena-desktop-root[hidden],#ena-desktop-fab[hidden]{display:none!important;}
#ena-desktop-root{--ena-light:#e1ded6;--ena-face:#d4d0c8;--ena-border:#77716b;--ena-navy:#142d66;--ena-icon-size:56px;position:fixed;inset:0;z-index:2147481000;isolation:isolate;line-height:1.3;}
#ena-desktop-root button,#ena-desktop-root input,#ena-desktop-root select,#ena-desktop-root textarea{font-family:Tahoma,Verdana,Arial,sans-serif;font-size:13px;}
#ena-desktop-root button{cursor:pointer;color:inherit;}

#ena-desktop-root .ena-desktop-icons{position:absolute;top:10px;left:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,115px);grid-auto-columns:114px;gap:2px 13px;z-index:1;align-items:start;}
#ena-desktop-root .ena-desktop-icon{border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 4px 2px;width:108px;height:107px;color:#fff!important;text-shadow:1px 1px #16233c,-1px 0 #16233c,0 1px #16233c;line-height:1.22;}
#ena-desktop-root .ena-desktop-icon img{width:var(--ena-icon-size);height:var(--ena-icon-size);object-fit:contain;filter:drop-shadow(1px 2px 1px #0b1a2baa);image-rendering:auto;}
#ena-desktop-root .ena-desktop-icon span{margin-top:5px;font-size:13.5px;display:block;text-align:center;max-width:105px;overflow-wrap:break-word;}
#ena-desktop-root .ena-desktop-icon:hover{background:#5273ae55;border:1px dotted #cad8f9;}
#ena-desktop-root .ena-desktop-icon:focus-visible{outline:1px dotted #fff;background:#1a3a7e77;}
#ena-desktop-root .ena-taskbar{position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(#e6e4dd 0%,#cfcac0 100%);border-top:2px solid #fff;box-shadow:0 -2px #62636c;display:flex;align-items:center;gap:5px;padding:2px 5px;z-index:150;}
#ena-desktop-root .ena-start-button{height:35px;min-width:100px;padding:2px 12px 2px 6px;background:linear-gradient(#fcfaf4,#d0c9bc);border:2px solid;border-color:#fff #666 #666 #fff;box-shadow:1px 1px #363636;display:flex;align-items:center;gap:7px;font-size:16px;font-weight:bold;}

#ena-desktop-root .ena-start-button:active{border-color:#777 #fff #fff #777;}
#ena-desktop-root .ena-task-items{display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden;flex:1;height:100%;}
#ena-desktop-root .ena-task-button{display:flex;align-items:center;gap:5px;min-width:68px;max-width:192px;width:170px;height:32px;overflow:hidden;padding:1px 7px;text-align:left;white-space:nowrap;text-overflow:ellipsis;border:2px solid;border-color:#fff #6d6d70 #6d6d70 #fff;background:#d8d5cb;}
#ena-desktop-root .ena-task-button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ena-desktop-root .ena-task-active{background:#c6c1b8;border-color:#676767 #fff #fff #676767;}
#ena-desktop-root .ena-tray{height:37px;min-width:115px;display:flex;align-items:center;justify-content:center;gap:6px;padding:1px 8px 1px 5px;background:#d9d6ce;border:1px solid;border-color:#777 #fff #fff #777;}

#ena-desktop-root .ena-tray-time{font-weight:bold;letter-spacing:.1px;white-space:nowrap;}
#ena-desktop-root .ena-tray-date{font-size:11px;color:#404147;white-space:nowrap;}
#ena-desktop-root .ena-window{position:absolute;display:flex;flex-direction:column;background:#d4d0c8;min-width:295px;min-height:230px;resize:both;border:3px solid;border-color:#f2f2ec #514d49 #514d49 #f2f2ec;box-shadow:1px 2px 0 #101827,5px 7px 12px #080f20aa;overflow:hidden;z-index:50;}

#ena-desktop-root .ena-titlebar{flex:0 0 31px;background:linear-gradient(90deg,#152966,#3262a1);display:flex;align-items:center;justify-content:space-between;color:#fff;gap:6px;padding:3px 4px 3px 7px;touch-action:none;cursor:move;user-select:none;}

#ena-desktop-root .ena-title strong{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:13px;color:#fff;}
#ena-desktop-root .ena-window-buttons{display:flex;align-items:center;gap:2px;}

#ena-desktop-root .ena-tab{border:2px solid;border-color:#fff #656460 #656460 #fff;background:#c4c0b9;padding:6px 11px 5px;white-space:nowrap;min-height:30px;}

#ena-desktop-root .ena-subtoolbar{flex-shrink:0;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #fff;border-bottom:1px solid #8c8980;padding:5px 11px;color:#4e4c4b;font-size:12px;}
#ena-desktop-root .ena-subtoolbar label{display:flex;align-items:center;gap:7px;}
#ena-desktop-root .ena-subtoolbar button,#ena-desktop-root .ena-control,#ena-desktop-root .ena-add-form button,#ena-desktop-root .ena-settings-content button{padding:4px 10px;border:2px solid;border-color:#fff #6d6b69 #6d6b69 #fff;background:#dedbd3;white-space:nowrap;}
#ena-desktop-root .ena-subtoolbar select,#ena-desktop-root .ena-add-form input,#ena-desktop-root .ena-add-form select,#ena-desktop-root .ena-settings-content select,#ena-desktop-root .ena-settings-content input:not([type=checkbox]):not([type=range]):not([type=file]){background:#fff;color:#222;border:2px solid;border-color:#777 #f5f5f5 #f5f5f5 #777;padding:4px 6px;min-width:0;}
#ena-desktop-root .ena-content{flex:1;min-height:0;background:#e8e5dd;border:2px solid;border-color:#6c6964 #fff #fff #6c6964;margin:6px;padding:13px;}
#ena-desktop-root .ena-scroll{overflow-y:auto;scrollbar-color:#aaa89d #e2dfd7;}
#ena-desktop-root .ena-media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
#ena-desktop-root .ena-media-card{border:1px solid #b5b0a8;background:#eeeae2;display:flex;flex-direction:column;padding:7px;gap:6px;min-width:0;min-height:180px;}
#ena-desktop-root .ena-media-art{height:97px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#464567,#25283d);border:1px solid #4e4c60;}
#ena-desktop-root .ena-media-art img{filter:drop-shadow(2px 2px 1px #101320);}
#ena-desktop-root .ena-media-data{display:flex;flex-direction:column;gap:5px;min-width:0;}
#ena-desktop-root .ena-media-data b{font-size:12px;overflow-wrap:anywhere;}
#ena-desktop-root .ena-media-data small{color:#5d5b5c;}
#ena-desktop-root .ena-media-badges{display:flex;gap:3px;flex-wrap:wrap;}
#ena-desktop-root .ena-tag{font-size:10px;border:1px solid #9a90a5;background:#ded7e0;padding:2px 4px;}
#ena-desktop-root .ena-card-buttons{display:flex;gap:4px;margin-top:auto;}
#ena-desktop-root .ena-card-buttons button{padding:2px 5px;border:1px solid #888;background:#ddd8d3;font-size:11px;}
#ena-desktop-root .ena-statusline{flex-shrink:0;padding:4px 9px;border-top:1px solid #fff;font-size:11px;color:#585653;background:#d4d0c8;}
#ena-desktop-root .ena-empty{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#62616a;gap:7px;padding:16px;}
#ena-desktop-root .ena-empty b{font-size:15px;color:#3b3c46;}
#ena-desktop-root .ena-empty p{max-width:440px;font-size:12px;margin:0;}

#ena-desktop-root .ena-add-form{padding:7px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#efebe5;border-bottom:1px solid #a69f98;}

#ena-desktop-root .ena-pane p{margin:5px 0;color:#55504f;font-size:12px;}
#ena-desktop-root .ena-row-list{border:1px solid #b4b0a7;background:#f0ede6;}

#ena-desktop-root .ena-start-menu{position:absolute;z-index:170;bottom:43px;left:5px;width:303px;min-height:255px;border:3px solid;border-color:#fff #424345 #424345 #fff;background:#d4d0c8;display:flex;box-shadow:3px 4px 0 #15233c99;}

#ena-desktop-root .ena-start-main{flex:1;padding:5px;display:flex;flex-direction:column;gap:2px;}

#ena-desktop-root .ena-calendar-popup{position:absolute;bottom:43px;right:4px;width:271px;padding:12px;background:#e7e3db;border:3px solid;border-color:#fff #676363 #676363 #fff;z-index:180;box-shadow:-2px -2px 12px #0005;}
#ena-desktop-root .ena-cal-heading{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:8px;}

  #ena-desktop-root .ena-taskbar{gap:3px;padding:2px;}
  #ena-desktop-root .ena-start-button{min-width:72px;padding:2px 5px;}
  #ena-desktop-root .ena-start-logo{font-size:16px;}
  #ena-desktop-root .ena-task-button{width:43px;min-width:43px;padding:1px 9px;justify-content:center;}
  #ena-desktop-root .ena-task-button span{display:none;}
  #ena-desktop-root .ena-media-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}

    if(kind==='archive'){item.year=String(fd.get('year')||'').trim().slice(0,12);item.progress=String(fd.get('progress')||'planned');item.ownership=fd.get('owned')?'personal':'unknown';item.revisit=false;meta().archive[ui.tab.archive].push(item);}
    else if(kind==='salon'){const t=ui.tab.salon,arr=meta().salon[t==='finance'?'transactions':t];arr.push(item);}
    else if(kind==='directory')meta().directory[ui.tab.directory].push(item);
    else if(kind==='gm'){const t=ui.tab.gm;meta().gm[t==='body'?'injuries':t==='items'?'items':'quests'].push(item);}
    saveMeta();ui.adding=null;fillWindow(active);toast('Запись сохранена');
  }
  function handleChange(ev){const el=ev.target,field=el.dataset.field,selection=el.dataset.select,s=settings(),m=meta();
    if(selection==='archive-filter'){ui.filter=el.value;fillWindow('archive');return;}
    if(selection==='wallpaper'){s.wallpaper=el.value;localWallpaper=null;try{localStorage.removeItem('ena-desktop-wallpaper');}catch{}persistSettings();updateWallpaper();return;}
    if(field==='game-date'){m.gameDate=el.value;saveMeta();updateClock();return;}
    if(field==='game-time'){m.gameTime=el.value;saveMeta();updateClock();return;}
    if(field==='auto-open'){s.autoOpen=el.checked;persistSettings();return;}
    if(field==='show-fab'){s.showFab=el.checked;persistSettings();return;}
    if(field==='wallpaper-file'){const file=el.files?.[0];if(!file)return;if(file.size>8_000_000){toast('Изображение слишком большое (максимум 8 МБ)');return;}const reader=new FileReader();reader.onload=()=>{
      const img=new Image();img.onload=()=>{const cv=document.createElement('canvas'),scale=Math.min(1,1600/img.width,1000/img.height);cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        try{const data=cv.toDataURL('image/jpeg',0.78);localStorage.setItem('ena-desktop-wallpaper',data);localWallpaper=data; // Browser-local: never stored in ST settings.
          updateWallpaper();toast('Обои изменены только в этом браузере');}
        catch(e){toast('Не удалось сохранить обои: недостаточно места');}
      };img.src=reader.result;
    };reader.readAsDataURL(file);return;}
  }
  function handleInput(ev){const field=ev.target.dataset.field;if(field==='notes'){meta().notes=ev.target.value;queueSave();return;}if(field==='icon-size'){settings().iconSize=Number(ev.target.value);persistSettings();updateWallpaper();ev.target.nextElementSibling&&(ev.target.nextElementSibling.textContent=ev.target.value+' px');}}
  function handlePointerDown(ev){const title=ev.target.closest('.ena-titlebar');if(!title||ev.target.closest('button')||ev.button!==0)return;const win=title.closest('.ena-window');if(!win||win.classList.contains('ena-maximized')||window.innerWidth<700)return;
    focusWindow(win.dataset.app);
    const startX=ev.clientX,startY=ev.clientY,x=win.offsetLeft,y=win.offsetTop;
    title.setPointerCapture(ev.pointerId);const move=e=>{const width=win.offsetWidth;const height=win.offsetHeight;win.style.left=Math.max(0,Math.min(window.innerWidth-width,x+e.clientX-startX))+'px';win.style.top=Math.max(0,Math.min(window.innerHeight-height-45,y+e.clientY-startY))+'px';};
    const up=e=>{title.removeEventListener('pointermove',move);title.removeEventListener('pointerup',up);title.removeEventListener('pointercancel',up);const r=meta().layout[win.dataset.app]||{};Object.assign(r,{x:win.offsetLeft,y:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight});meta().layout[win.dataset.app]=r;saveMeta();};
    title.addEventListener('pointermove',move);title.addEventListener('pointerup',up,{once:true});title.addEventListener('pointercancel',up,{once:true});
  }
  function onMessageSent(){if(!settings().autoOpen)return;const c=ctx();const chat=c?.chat||[];const entry=chat.at(-1);if(!entry||!entry.is_user||entry.is_system)return;const text=String(entry.mes||'');const id=`${chat.length}:${text}`;if(lastHandled===id)return;lastHandled=id;
    // No model interpretation, no substring matching other characters' dialogue.
    const sentence='(?:^|[^\\p{L}])Ена[^.!?\\n]{0,100}?';
    const opened=new RegExp(sentence+'(?:открыла|включила|запустила|раскрыла)[^.!?\\n]{0,60}?(?:ноутбук|ноут)(?=$|[^\\p{L}])','iu');
    const closed=new RegExp(sentence+'(?:закрыла|выключила|захлопнула)[^.!?\\n]{0,60}?(?:ноутбук|ноут)(?=$|[^\\p{L}])','iu');
    if(closed.test(text)){if(running)shutdown(false);return;}
    if(opened.test(text)&&!/(?:Ена\s+(?:не|никогда)\s+(?:открыла|включила)|Ена[^.!?\n]{0,30}?не\s+(?:открыла|включила))/i.test(text))boot();
  }
  function init(){if(document.getElementById('ena-desktop-root'))return;generateShell();const saved=(()=>{try{return localStorage.getItem('ena-desktop-wallpaper')}catch{return null}})();if(saved&&saved.startsWith('data:image/')){localWallpaper=saved;updateWallpaper();}
    const c=ctx();if(c?.eventSource?.on&&c?.event_types){
      if(c.event_types.MESSAGE_SENT)c.eventSource.on(c.event_types.MESSAGE_SENT,onMessageSent);
      if(c.event_types.CHAT_CHANGED)c.eventSource.on(c.event_types.CHAT_CHANGED,()=>{clearTimeout(saveTimer);lastHandled=null;if(running){shutdown(false);boot();}});
    }
    console.info('[EnaDesktop] v'+VERSION+' ready');
  }
  return {init,boot,shutdown};
})();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ENA.init,{once:true});else ENA.init();

window.addEventListener('load',()=>setTimeout(()=>ENA.boot(),40));
</script></body></html>
